services:
  - type: web
    name: desk-book
    runtime: docker
    plan: free
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: desk-book-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: ADMIN_LOGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMPLOYEE_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: 1
      - key: RAILS_MAX_THREADS
        value: 3

databases:
  - name: desk-book-db
    plan: free
